<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f7f3ee; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { margin-bottom: 20px; color: #3d2314; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        button { width: 100%; background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: #dc3545; margin-bottom: 15px; font-size: 0.9rem; font-weight: bold; }
        .volver { display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Panel Administrador</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <input type="text" name="usuario" placeholder="Usuario" required autofocus>
            <input type="password" name="clave" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>

        <a href="/" class="volver">&larr; Volver al catálogo</a>
    </div>
</body>
</html>
