<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 12px; margin-bottom: 5px; color: #333; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
        .btn-submit { width: 100%; background: #28a745; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-cancel { display: block; text-align: center; color: #666; margin-top: 15px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Editar Información del Producto</h2>
        <form method="POST" enctype="multipart/form-data">
            <label>Nombre del Producto:</label>
            <input type="text" name="nombre" value="{{ producto.nombre }}" required>

            <label>Precio base ($ / mes):</label>
            <input type="text" name="precio" value="{{ producto.precio }}" required>

            <label>Cambiar foto principal (opcional):</label>
            <input type="file" name="imagen" accept="image/*">

            <label>Cargar fotos adicionales del producto (puedes seleccionar varias):</label>
            <input type="file" name="fotos_extra" accept="image/*" multiple>

            <label>Planes y Descuentos por Meses:</label>
            <textarea name="descuentos" rows="3" placeholder="Ejemplo:&#10;1 Mes: $10.000&#10;3 Meses: $25.000 (15% OFF)&#10;6 Meses: $45.000 (25% OFF)">{{ producto.descuentos or '' }}</textarea>

            <label>Descripción General:</label>
            <textarea name="descripcion" rows="3">{{ producto.descripcion or '' }}</textarea>

            <label>URL de Video demostrativo (YouTube o similar):</label>
            <input type="text" name="video_url" value="{{ producto.video_url or '' }}" placeholder="https://www.youtube.com/watch?v=...">

            <label>Texto Informativo Detallado:</label>
            <textarea name="texto_extra" rows="4" placeholder="Carga la descripción detallada del servicio o producto...">{{ producto.texto_extra or '' }}</textarea>

            <button type="submit" class="btn-submit">Guardar Cambios</button>
        </form>
        <a href="/producto/{{ producto.id }}" class="btn-cancel">Cancelar</a>
    </div>
</body>
</html>
