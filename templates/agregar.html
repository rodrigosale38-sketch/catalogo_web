<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .form-card { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 15px; text-align: center; }
        input, textarea, button { width: 100%; margin-bottom: 12px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; }
        a { display: block; text-align: center; color: #007bff; text-decoration: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Nuevo Producto</h2>
        <form action="/admin/agregar" method="POST" enctype="multipart/form-data">
            <input type="text" name="nombre" placeholder="Nombre del producto" required>
            <input type="text" name="precio" placeholder="Precio (ej: $15.000)" required>
            <textarea name="descripcion" placeholder="Descripción breve"></textarea>
            <label style="font-size: 0.85rem; color: #555;">Seleccionar foto:</label>
            <input type="file" name="imagen" accept="image/*" required>
            <button type="submit">Guardar Producto</button>
        </form>
        <a href="/">Volver al Catálogo</a>
    </div>
</body>
</html>
